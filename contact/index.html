<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact / suriyah saravanan</title>
    <meta name="theme-color" content="#4a020f">

  
    <link rel="icon" type="image/png" href="/s-transparent.png">

   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0b;
            --bg-elevated: #111113;
            --surface: #151517;
            --border: #241417;
            --border-hover: #4a1218;
            --maroon: #3a0d12;
            --crimson: #4a020f;
            --crimson-bright: #e0273f;
            --text: #ece9e6;
            --text-dim: #8c8a88;
            --text-faint: #4c4a49;
            --mono: 'JetBrains Mono', monospace;
            --display: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        ::selection {
            background: var(--crimson);
            color: #fff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--display);
            font-size: 18px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px; 
            display: flex;
            flex-direction: column;
            gap: 2rem;
            flex: 1;
            margin-top: 3rem;
        }

        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            font-family: var(--mono);
        }

        .back-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px; 
            letter-spacing: 0.08em;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text);
        }

        .title {
            font-size: 14px; 
            color: var(--text-dim);
            letter-spacing: 0.08em;
        }

        .accent-red {
            color: var(--crimson);
        }

        .intro {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .intro h1 {
            font-size: clamp(32px, 5vw, 44px); 
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .intro p {
            color: var(--text-dim);
            font-size: 18px; 
            line-height: 1.6;
        }

        .contact-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            position: relative;
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        .contact-card::before {
            content: "";
            position: absolute;
            left: -1px;
            top: -1px;
            bottom: -1px;
            width: 2px;
            background: var(--crimson);
            transform: scaleY(0);
            transform-origin: top;
            transition: transform 0.3s ease;
        }

        
        .contact-card:hover {
            background: var(--surface);
            border-color: var(--border-hover);
        }

        .contact-card:hover::before {
            transform: scaleY(1);
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .contact-name {
            font-size: 22px; 
            font-weight: 600;
            color: var(--text);
        }

        .contact-handle {
            font-family: var(--mono);
            font-size: 16px; 
            color: var(--crimson-bright);
            letter-spacing: 0.02em;
        }

        .arrow {
            font-family: var(--mono);
            color: var(--text-faint);
            font-size: 16px; 
            transition: transform 0.25s ease, color 0.25s ease;
        }

        
        .contact-card:hover .arrow {
            transform: translate(3px, -3px);
            color: var(--crimson-bright);
        }

        footer {
            text-align: left;
            font-family: var(--mono);
            font-size: 13px; 
            color: var(--text-faint);
            letter-spacing: 0.03em;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

       
        .site-logo {
            position: absolute;
            top: 28px;
            left: 28px;
            z-index: 1000;
            transition: transform 0.2s ease;
        }

        .site-logo img {
            width: 38px; 
            height: auto;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }

        
        .site-logo:hover {
            transform: scale(1.05);
        }

        .site-logo:hover img {
            opacity: 1;
        }

        @media (max-width: 1050px) {
            .site-logo {
                top: 16px;
                left: 16px;
            }
            .site-logo img {
                width: 28px;
            }
        }
    </style>
</head>
<body>


    <a href="/" class="site-logo">
        <img src="/s-transparent.png" alt="suriyah.dev logo">
    </a>

    <div class="container">
        <header>
            <a href="/" class="back-link">← cd /home</a>
            <div class="title"><span class="accent-red">port 25</span> / contact</div>
        </header>

        <section class="intro">
            <h1>contact me</h1>
            <p>available for professional inquiries, collaboration, and opportunities</p>
        </section>

        
        <div class="contact-grid">
            
            <a class="contact-card" href="mailto:s@suriyah.dev">
                <div class="contact-info">
                    <span class="contact-name">email</span>
                    <span class="contact-handle">s@suriyah.dev</span>
                </div>
                <span class="arrow">↗</span>
            </a>

            <a class="contact-card" href="https://github.com/suriyahs" target="_blank" rel="noopener">
                <div class="contact-info">
                    <span class="contact-name">github</span>
                    <span class="contact-handle">@suriyahs</span>
                </div>
                <span class="arrow">↗</span>
            </a>

            <a class="contact-card" href="https://www.linkedin.com/in/suriyahs/" target="_blank" rel="noopener">
                <div class="contact-info">
                    <span class="contact-name">linkedin</span>
                    <span class="contact-handle">/in/suriyahs</span>
                </div>
                <span class="arrow">↗</span>
            </a>

            
        </div>

        <footer>
            © 2026 suriyah saravanan
        </footer>
    </div>

</body>
</html>
